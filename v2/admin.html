<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理 | 佐世保キックボクシング倶楽部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style id="app-css">
:root { --main: #d63a2f; --navy: #173b8c; --yellow: #ffcf33; --bg: #f3f6fd; --ink: #1e2433; --muted: #6b7280; --line: #dbe1f0; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "M PLUS Rounded 1c", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 500; background: var(--bg); color: var(--ink); }
.wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 12px; }
h2 { font-size: 16px; margin: 0 0 8px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.big { font-size: 40px; font-weight: 700; line-height: 1.1; }
.sub { color: var(--muted); font-size: 14px; }
.btn { display: block; width: 100%; padding: 18px; font-size: 20px; font-weight: 800; color: #fff; background: var(--main); border: 0; border-radius: 999px; box-shadow: 0 4px 0 #a52a21; letter-spacing: .02em; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a52a21; }
.btn:disabled { background: #bbb; }
.btn.sec { background: #fff; color: var(--navy); border: 2px solid var(--navy); box-shadow: none; margin-top: 8px; }
.btn.sm { padding: 10px; font-size: 15px; }
.list { padding: 0; margin: 8px 0 0; list-style: none; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
.msg { padding: 12px; border-radius: 8px; background: #fff3e0; margin-bottom: 12px; }
.msg.err { background: #ffebee; }
input[type=text], input[type=password], input[type=tel], input[type=date], select { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 10px; border: 1px solid var(--line); background: #fff; border-radius: 8px; }
.tabs button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { border-top: 1px solid var(--line); padding: 8px 4px; text-align: left; }
.hidden { display: none; }
details.card summary { cursor: pointer; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary::before { content: "▸ "; color: var(--main); }
details.card[open] summary::before { content: "▾ "; }
details.card summary .sub { margin-left: 6px; }
.cal-title { font-weight: 700; margin-bottom: 6px; }
.cal + .cal { margin-top: 12px; }
.cal-grid { table-layout: fixed; text-align: center; }
.cal-grid th { font-weight: 400; color: var(--muted); border: 0; padding: 2px 0; font-size: 12px; }
.cal-grid th:first-child, .cal-grid td:first-child { color: #c62828; }
.cal-grid th:last-child, .cal-grid td:last-child { color: #1565c0; }
.cal-grid td { border: 0; padding: 2px 0; height: 44px; vertical-align: top; font-size: 14px; }
.cal-day.on { background: #ffebee; border-radius: 8px; font-weight: 700; color: var(--main) !important; }
.cal-day.night { background: #e3f2fd; border-radius: 8px; font-weight: 700; color: #1565c0 !important; }
.cal-day.off { color: #aaa !important; text-decoration: line-through; }
.cal-day.today { outline: 2px solid var(--main); outline-offset: -2px; border-radius: 8px; }
.cal-mark { font-size: 11px; line-height: 1; margin-top: 2px; color: var(--main); }
.cal-mark .m-day { color: var(--main); }
.cal-mark .m-night { color: #1565c0; }
.cal-day.off .cal-mark { color: #aaa; text-decoration: none; }
label.sub { display:block; margin-top: 8px; }

.cal-legend { margin-top: 10px; display: grid; gap: 6px; font-size: 14px; }
.lg { padding: 6px 10px; border-radius: 8px; }
.lg-day { background: #ffebee; color: var(--main); }
.lg-night { background: #e3f2fd; color: #1565c0; }
.lg-off { background: #eee; color: #777; }
.stat-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 6px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat-label { color: var(--muted); font-size: 13px; }
.stat-num { font-size: 34px; font-weight: 700; line-height: 1.2; }
.stat-num b { font-size: 44px; margin: 0 4px; color: var(--main); }
.stat-unit { font-size: 16px; margin-left: 4px; }
.ticket { display: flex; gap: 6px; margin-top: 8px; }
.tk { flex: 1; text-align: center; border: 2px solid var(--line); border-radius: 8px; padding: 6px 0; color: var(--muted); }
.tk.used { border-color: var(--main); background: #ffebee; color: var(--main); }
.tk-n { font-size: 22px; line-height: 1; }
.tk-d { font-size: 11px; margin-top: 4px; min-height: 13px; }
@media (min-width: 420px) { .stat-row { grid-template-columns: 1fr 1fr; } .stat:first-child { grid-column: 1 / -1; } }
.warn { margin: 10px 0 8px; padding: 8px 10px; background: #ffebee; color: #c62828; border-radius: 8px; font-weight: 700; }
#ticketNote .btn { margin-top: 4px; }
td.ops button { display: block; width: 100%; margin: 2px 0; font-size: 12px; }

/* 未収あり：画面全体を赤系に */
.unpaid-banner { background: var(--main); color: #fff; font-weight: 700; padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; text-align: center; }
body.unpaid { background: #c62828; }
body.unpaid h1 { color: #fff; }
body.unpaid .card { border-color: #ef9a9a; background: #fff5f5; }
body.unpaid .unpaid-banner { background: #fff; color: var(--main); border: 3px solid #fff; }
.recent { display:block; font-size: 16px; font-weight: 700; color: var(--ink); margin: 2px 0 4px; }

/* ---- ブランド（ヘッダー・ヒーロー・アクション帯） ---- */
.brand { background: var(--navy); color: #fff; }
.brand-in { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand-logo { width: 56px; height: 56px; border-radius: 50%; background: #fff; object-fit: cover; flex: none; box-shadow: 0 0 0 3px var(--yellow); }
.brand-name { font-size: 15px; font-weight: 800; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--yellow); font-weight: 700; }
.brand-link { margin-left: auto; color: #fff; font-size: 14px; text-decoration: underline; }
.wrap > h1 { display: none; }
.hero { position: relative; border-radius: 16px; overflow: hidden; margin: 4px 0 14px; box-shadow: 0 6px 18px rgba(23,59,140,.18); }
.hero img { display: block; width: 100%; height: auto; }
.hero-copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 12px; color: #fff; font-weight: 800; font-size: 17px; text-shadow: 0 1px 6px rgba(0,0,0,.55); background: linear-gradient(transparent, rgba(23,59,140,.75)); }
.card.action { background: var(--yellow); border-color: var(--yellow); padding: 14px; }
.card.action .btn { box-shadow: 0 4px 0 #a52a21; }
.card.action #doneLine { text-align: center; font-weight: 800; color: var(--navy); padding: 12px 0 4px; font-size: 18px; }
.stat-num b { color: var(--main); }
.cal-day.today { outline-color: var(--navy); }
h2 { color: var(--navy); }
details.card summary::before { color: var(--navy); }

/* お祝い（入会記念・節目） */
.celebrate { position: relative; overflow: hidden; background: var(--yellow); color: var(--navy); border-radius: 14px; padding: 16px 12px; margin-bottom: 12px; text-align: center; box-shadow: 0 6px 18px rgba(255,207,51,.45); }
.celebrate-line { font-size: 20px; font-weight: 800; line-height: 1.5; position: relative; z-index: 1; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; opacity: .9; animation: fall 2.6s linear infinite; }
@keyframes fall { 0% { transform: translateY(-20px) rotate(0); } 100% { transform: translateY(140px) rotate(360deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

/* HP・グッズへのリンク（画面の一番下） */
.club-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 24px; }
.club-links .btn { margin-top: 0; text-align: center; text-decoration: none; }

/* 管理画面：会員カード */
.mcard { border-top: 2px solid var(--line); padding: 14px 0; }
.mcard-head b { font-size: 18px; }
.mcard-ops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mcard-ops button { flex: 1 1 45%; padding: 8px 4px; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.outside-line { margin: 18px 0 4px; padding: 8px 10px; background: #eceff5; color: var(--muted); font-weight: 700; border-radius: 8px; text-align: center; }
</style>
</head>
<body>
<header class="brand">
  <div class="wrap brand-in">
    <img src="img/logo.png" alt="" class="brand-logo">
    <div class="brand-text"><div class="brand-name">佐世保キックボクシング倶楽部</div><div class="brand-sub">管理画面</div></div>
    <a href="checkin.html" class="brand-link">受付へ</a>
  </div>
</header>
<div class="wrap">
  <div id="msg" class="msg hidden"></div>
  <div id="gate" class="card">確認中…</div>
  <div id="app" class="hidden">
    <div class="tabs">
      <button data-tab="today" class="on">今日</button>
      <button data-tab="sessions">開催</button>
      <button data-tab="members">会員</button>
    </div>

    <div id="t-today" class="card">
      <div id="todayHead" class="sub"></div>
      <table><thead><tr><th>時刻</th><th>名前</th><th>種別</th><th>金額</th></tr></thead><tbody id="todayRows"></tbody></table>
      <p><b>本日の受け取り合計：<span id="cashTotal">0</span> 円</b></p>
      <p>今日来た人の未収：<span id="todayUnpaid">0</span> 円<br><span class="sub">全体の未収（今日来ていない人・過去の分も含む）：<span id="unpaidTotal">0</span> 円</span></p>
      <button class="btn sec sm" id="btnTodayReload">更新</button>
    </div>

    <div id="t-pending" class="card hidden">
      <div id="pendingList"></div>
      <button class="btn sec sm" id="btnPendingReload">更新</button>
    </div>

    <div id="t-sessions" class="card hidden">
      <p class="sub">開催を登録します（通算番号は自動）</p>
      <label class="sub">日付</label>
      <input type="date" id="sDate">
      <div style="margin:8px 0">
        <label><input type="radio" name="slot" value="昼" checked> 昼（10:00〜12:00）</label>
        <label style="margin-left:16px"><input type="radio" name="slot" value="夜"> 夜（19:00〜21:00）</label>
      </div>
      <label class="sub">会場</label>
      <select id="sPlace">
        <option value="武道館" selected>武道館</option>
        <option value="まちなかコミュニティ２F第4講座室">まちなかコミュニティ２F第4講座室</option>
      </select>
      <button class="btn" id="btnAddSession" style="margin-top:8px">登録</button>
      <p class="sub" style="margin-top:16px">月：<input type="text" id="sMonth" placeholder="2026-09" style="width:120px"> <button id="btnSessionsReload">表示</button></p>
      <table><thead><tr><th>第</th><th>日付</th><th>昼夜</th><th>会場</th><th>状態</th><th>人数</th><th></th></tr></thead><tbody id="sessionRows"></tbody></table>
    </div>

    <div id="t-members" class="card hidden">
      <p class="sub">暗証番号を忘れた人は「番号リセット」→ 新しい4桁を伝えてください（その人の全端末がログアウトします）</p>
      <label class="sub">並び順</label>
      <select id="mSort">
        <option value="main">総合（通算の多い順→直近2か月の参加率。最近来ていない人は枠外の下へ）</option>
        <option value="rate">参加率の高い順</option>
        <option value="recent">直近2か月の参加率の高い順</option>
        <option value="name">名前順</option>
      </select>
      <p class="sub" id="mCount"></p>
      <div id="memberRows"></div>
      <button class="btn sec sm" id="btnMembersReload">更新</button>
    </div>
  </div>
</div>

<script src="config.js?v=20260919j"></script>
<script src="api.js?v=20260919j"></script>
<script>
const $ = (id) => document.getElementById(id);
function msg(text, isErr) { const m = $('msg'); m.textContent = text || ''; m.classList.toggle('err', !!isErr); m.classList.toggle('hidden', !text); }
function slotLabel(t) { return t === '夜' ? '夜 19:00〜21:00' : '昼 10:00〜12:00'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['today', 'pending', 'sessions', 'members'].forEach(t => $('t-' + t).classList.toggle('hidden', t !== b.dataset.tab));
  ({ today: loadToday, pending: loadPending, sessions: loadSessions, members: loadMembers })[b.dataset.tab]();
});

async function loadToday() {
  const r = await KickApi.call('admin.today');
  if (!r.ok) return msg(r.message, true);
  $('todayHead').textContent = r.session ? '第' + r.session.通算番号 + '回 ' + r.session.日付 + '（' + slotLabel(r.session.時間帯) + '）' + (r.session.会場 || '') : '今日の開催はありません';
  $('todayRows').innerHTML = r.list.map(a => '<tr><td>' + esc(String(a.日時).slice(11, 16)) + '</td><td>' + esc(a.表示名) + (a.unpaid > 0 ? ' <span title="未収 ' + esc(a.unpaid) + '円">🔴</span>' : '') + ((a.celebrate || []).length ? '<div style="color:#b8860b;font-size:12px;font-weight:700">🎉 ' + esc(a.celebrate.join('・')) + '</div>' : '') + '</td><td>' + esc(a.支払い種別) + '</td><td>' + (Number(a.金額) || 0).toLocaleString() + '</td></tr>').join('') || '<tr><td colspan="4" class="sub">まだ出席がありません</td></tr>';
  $('cashTotal').textContent = r.cashTotal.toLocaleString();
  $('todayUnpaid').textContent = (r.todayUnpaid || 0).toLocaleString();
  $('unpaidTotal').textContent = (r.unpaidTotal || 0).toLocaleString();
}

async function loadPending() {
  const r = await KickApi.call('admin.pending');
  if (!r.ok) return msg(r.message, true);
  if (!r.pending.length) { $('pendingList').innerHTML = '<p class="sub">承認待ちはありません</p>'; return; }
  const options = '<option value="">（新規会員として承認）</option>' + r.candidates.map(c => '<option value="' + esc(c.会員ID) + '">' + esc(c.表示名) + '（残り' + esc(c.残り回数) + '）</option>').join('');
  $('pendingList').innerHTML = r.pending.map(p => '<div style="padding:8px 0;border-top:1px solid #ddd"><b>' + esc(p.表示名) + '</b><div class="sub">' + esc(p.備考) + '</div>'
    + '<select data-id="' + esc(p.会員ID) + '">' + options + '</select>'
    + '<button class="btn sec sm" data-approve="' + esc(p.会員ID) + '">承認する</button></div>').join('');
  $('pendingList').querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => {
    const sel = $('pendingList').querySelector('select[data-id="' + b.dataset.approve + '"]');
    const link = sel.value;
    if (!confirm(link ? '既存の会員に紐づけます。よろしいですか？' : '新規会員として承認します。よろしいですか？')) return;
    const rr = await KickApi.call('admin.approve', { pendingMemberId: b.dataset.approve, linkToMemberId: link || undefined });
    msg(rr.message, !rr.ok); loadPending();
  });
}

async function loadSessions() {
  const r = await KickApi.call('admin.sessions', { month: $('sMonth').value.trim() || undefined });
  if (!r.ok) return msg(r.message, true);
  $('sessionRows').innerHTML = r.list.map(s => '<tr><td>' + esc(s.通算番号) + '</td><td>' + esc(s.日付) + '</td><td>' + esc(s.時間帯) + '</td><td>' + esc(s.会場) + '</td><td>' + esc(s.状態) + '</td><td>' + esc(s.出席人数) + '</td><td>'
    + (s.状態 !== '中止' ? '<button data-cancel="' + esc(s.開催ID) + '" data-date="' + esc(s.日付) + '" data-slot="' + esc(s.時間帯) + '" data-place="' + esc(s.会場) + '">中止</button>' : '') + '</td></tr>').join('');
  $('sessionRows').querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    if (!confirm(b.dataset.date + ' ' + b.dataset.slot + ' を中止にしますか？')) return;
    const rr = await KickApi.call('admin.upsertSession', { 開催ID: b.dataset.cancel, 日付: b.dataset.date, 時間帯: b.dataset.slot, 会場: b.dataset.place, 状態: '中止' });
    msg(rr.ok ? '中止にしました' : rr.message, !rr.ok); loadSessions();
  });
}

let membersCache = [];
async function loadMembers() {
  const r = await KickApi.call('admin.members');
  if (!r.ok) return msg(r.message, true);
  membersCache = r.list;
  renderMembers();
}

// 総合の並びで「枠外」にする基準：直近2か月の参加率がこれ未満（未計算も枠外）
const OUTSIDE_RECENT_BELOW = 20;
function isOutside(m) { return m.recent === null || m.recent === undefined || Number(m.recent) < OUTSIDE_RECENT_BELOW; }

// 並び替え：参加率が同じ（または未計算）なら通算の多い順
function sortMembers(list, key) {
  const num = (v) => (v === null || v === undefined ? -1 : Number(v));
  const byTotal = (a, b) => b.通算 - a.通算;
  const cmp = {
    main: (a, b) => isOutside(a) - isOutside(b) || byTotal(a, b) || num(b.recent) - num(a.recent),
    rate: (a, b) => num(b.rate) - num(a.rate) || byTotal(a, b),
    recent: (a, b) => num(b.recent) - num(a.recent) || byTotal(a, b),
    name: (a, b) => String(a.表示名).localeCompare(String(b.表示名), 'ja'),
  }[key] || byTotal;
  return list.slice().sort(cmp);
}

// 会員画面と同じ回数券（①〜⑤、使った日付入り）
function ticketHtml(m) {
  if (m.exempt) return '<div class="stat-label">区分</div><div class="stat-num" style="font-size:24px">' + esc(m.区分) + '</div><div class="sub">券は使いません</div>';
  const t = m.ticket || { size: 5, remaining: Number(m.残り回数) || 0, used: [] };
  const circ = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
  let dots = '';
  for (let i = 0; i < t.size; i++) {
    const used = i < t.used.length;
    const d = used && t.used[i] ? t.used[i].slice(5).replace('-', '/') : '';
    dots += '<div class="tk' + (used ? ' used' : '') + '"><div class="tk-n">' + circ[i] + '</div><div class="tk-d">' + (used ? (d || '済') : '') + '</div></div>';
  }
  const over = t.remaining > t.size ? '<div class="sub" style="color:#c62828">残りが券1枚分（5回）を超えています</div>' : '';
  return '<div class="stat-label">回数券</div><div class="stat-num">' + (t.none ? '<span class="sub">回数券はまだありません</span>' : '残り<b>' + t.remaining + '</b>回') + '</div><div class="ticket">' + dots + '</div>' + over;
}

function memberCardHtml(m) {
  const join = m.入会日 ? m.入会日.replace(/-/g, '/') + ' 入会' + (m.days ? '（' + Number(m.days).toLocaleString() + '日目）' : '') : '入会日なし';
  const pct = (v) => (v === null || v === undefined ? '―' : v + '%');
  return '<div class="mcard">'
    + '<div class="mcard-head"><b>' + esc(m.表示名) + '</b>' + (m.locked ? ' 🔒' : '')
    + '<div class="sub" style="font-size:12px">' + esc(m.会員ID) + '・' + esc(m.区分) + '・' + esc(m.状態) + (m.登録 ? '・登録 ' + esc(m.登録) : '') + '</div>'
    + (m.未収 > 0 ? '<div style="color:#c62828;font-size:13px;font-weight:700">🔴 未収 ' + Number(m.未収).toLocaleString() + '円</div>' : '') + '</div>'
    + '<div class="stat-row">'
    + '<div class="stat">' + ticketHtml(m) + '</div>'
    + '<div class="stat"><div class="stat-label">通算参加</div><div class="stat-num">' + esc(m.通算) + '<span class="stat-unit">回</span></div><div class="sub">' + esc(join) + '</div></div>'
    + '<div class="stat"><div class="stat-label">参加率</div><div class="stat-num">' + pct(m.rate) + '</div><span class="recent">（直近2か月 ' + pct(m.recent) + '）</span></div>'
    + '</div>'
    + '<div class="mcard-ops">'
    + (m.未収 > 0 ? '<button data-paid="' + esc(m.会員ID) + '" data-name="' + esc(m.表示名) + '" data-amt="' + m.未収 + '">入金済みにする</button>' : '')
    + '<button data-grant="' + esc(m.会員ID) + '" data-name="' + esc(m.表示名) + '">券を付与</button>'
    + '<button data-remain="' + esc(m.会員ID) + '" data-name="' + esc(m.表示名) + '" data-now="' + esc(m.残り回数) + '">残り回数を直す</button>'
    + '<button data-reset="' + esc(m.会員ID) + '" data-name="' + esc(m.表示名) + '">番号リセット</button>'
    + '<button data-del="' + esc(m.会員ID) + '" data-name="' + esc(m.表示名) + '" style="color:#c62828">誤登録を削除</button></div></div>';
}

function renderMembers() {
  const list = sortMembers(membersCache, $('mSort').value);
  const key = $('mSort').value;
  const outCount = key === 'main' ? list.filter(isOutside).length : 0;
  $('mCount').textContent = list.length + '名（退会を除く）' + (key === 'main' ? '・枠外 ' + outCount + '名' : '');
  let firstOut = true;
  $('memberRows').innerHTML = list.map(m => {
    let sep = '';
    if (key === 'main' && isOutside(m) && firstOut) {
      firstOut = false;
      sep = '<div class="outside-line">ここから枠外：直近2か月の参加率 ' + OUTSIDE_RECENT_BELOW + '%未満（' + outCount + '名）</div>';
    }
    return sep + memberCardHtml(m);
  }).join('') || '<p class="sub">会員がいません</p>';
  $('memberRows').querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => {
    if (!confirm(b.dataset.name + ' の未収 ' + Number(b.dataset.amt).toLocaleString() + '円 を入金済みにしますか？')) return;
    const rr = await KickApi.call('admin.markPaid', { 会員ID: b.dataset.paid });
    msg(rr.message, !rr.ok); loadMembers();
  });
  $('memberRows').querySelectorAll('[data-grant]').forEach(b => b.onclick = async () => {
    const paid = confirm(b.dataset.name + ' に5回券を付与します。代金を受け取り済みなら「OK」、後払い（未収）なら「キャンセル」');
    if (!paid && !confirm('未収（後払い）として付与しますか？')) return;
    const rr = await KickApi.call('admin.purchase', { 会員ID: b.dataset.grant, paid });
    msg(rr.message, !rr.ok); loadMembers();
  });
  $('memberRows').querySelectorAll('[data-remain]').forEach(b => b.onclick = async () => {
    const v = prompt(b.dataset.name + ' の残り回数（今 ' + b.dataset.now + ' 回）を何回に直しますか？（お金の記録は変わりません）', b.dataset.now);
    if (v === null) return;
    const rr = await KickApi.call('admin.setRemaining', { 会員ID: b.dataset.remain, 残り回数: v });
    msg(rr.message, !rr.ok); loadMembers();
  });
  $('memberRows').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const pre = await KickApi.call('admin.deleteMember', { 会員ID: b.dataset.del, dryRun: true });
      if (!pre.ok) return msg(pre.message, true);
      const sm = pre.summary;
      const lines = [sm.表示名 + '（' + b.dataset.del + '）を削除します。一緒に消えるもの：',
        '・出席 ' + sm.出席.length + '件' + (sm.出席.length ? '：' + sm.出席.join('、') : ''),
        '・購入 ' + sm.購入.length + '件' + (sm.購入.length ? '：' + sm.購入.join('、') : ''),
        '', '元に戻せません。よろしいですか？'];
      if (!confirm(lines.join('\n'))) return;
      if (!confirm('最終確認：本当に ' + sm.表示名 + '（' + b.dataset.del + '）を削除しますか？')) return;
      msg('削除しています…（そのままお待ちください）');
      const rr = await KickApi.call('admin.deleteMember', { 会員ID: b.dataset.del });
      msg(rr.message, !rr.ok); loadMembers();
    } finally { b.disabled = false; }
  });
  $('memberRows').querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    const pin = prompt(b.dataset.name + ' の新しい暗証番号（4桁）を入力');
    if (pin === null) return;
    const rr = await KickApi.call('admin.resetPin', { 会員ID: b.dataset.reset, pin });
    msg(rr.message, !rr.ok); loadMembers();
  });
}

$('btnTodayReload').onclick = loadToday;
$('btnPendingReload').onclick = loadPending;
$('btnSessionsReload').onclick = loadSessions;
$('btnMembersReload').onclick = loadMembers;
$('mSort').onchange = renderMembers;
$('btnAddSession').onclick = async () => {
  const slot = document.querySelector('input[name=slot]:checked').value;
  const r = await KickApi.call('admin.upsertSession', { 日付: $('sDate').value.trim(), 時間帯: slot, 会場: $('sPlace').value || '武道館', 状態: '予定' });
  msg(r.ok ? '登録しました' : r.message, !r.ok);
  if (r.ok) { $('sMonth').value = $('sDate').value.trim().slice(0, 7); loadSessions(); }
};

(async () => {
  if (!KickApi.token()) { $('gate').innerHTML = '先に <a href="checkin.html">受付画面</a> でログインしてください'; return; }
  const me = await KickApi.call('me');
  if (!me.ok || !me.isAdmin) { $('gate').textContent = me.needLogin ? '先に受付画面でログインしてください' : '管理者だけが開けます'; return; }
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  $('sMonth').value = new Date().toISOString().slice(0, 7);
  loadToday();
})();
</script>
</body>
</html>
